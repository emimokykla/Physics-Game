
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Assembly – The room</title>
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="menu">
    <div class="menu-card">
      <h1>PC Assembly – <span id="selected-map">Classic</span></h1>
      <h2>Controls</h2>
      <ul>
        <li><strong>WASD</strong> – Move</li>
        <li><strong>Shift</strong> – Run</li>
        <li><strong>Ctrl</strong> – Crouch</li>
        <li><strong>Space</strong> – Jump</li>
        <li><strong>Mouse</strong> – Look around</li>
        <li><strong>E</strong> – Pick up / Place</li>
        <li><strong>F</strong> – Unbox / Install parts, remove glass, toggle monitor</li>
        <li><strong>Left click</strong> – Throw</li>
        <li><strong>Esc</strong> – Menu</li>
      </ul>
      <button id="start">Start game</button>
      <button id="start-menu">Back to menu</button>
    </div>
  </div>

  <div id="hud" hidden>
    <p id="score-row">Points: <span id="score">0</span></p>
    <p>Held object: <span id="held">None</span></p>
    <p id="build-status" hidden></p>
  </div>

  <div id="interaction-hint" hidden></div>
  <div id="crosshair">+</div>

  <script type="module" src="main.js"></script>
</body>
</html>
